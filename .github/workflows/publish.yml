name: Build and Package

on:
  workflow_dispatch:
  push:
	tags:
	  - 'v*'

jobs:
	build-and-package:
	runs-on: windows-latest

	steps:
	- name: Checkout
	  uses: actions/checkout@v4

	- name: Setup .NET
	  uses: actions/setup-dotnet@v4
	  with:
		dotnet-version: '7.0.400'

	- name: Restore
	  run: dotnet restore

	- name: Build
	  run: dotnet build -c Release --no-restore

	- name: Run unit tests
	  run: dotnet test Tests/Switch.Tests.csproj -c Release --no-build --verbosity normal

	- name: Publish Switch
	  run: dotnet publish Switch -c Release -o ${{ github.workspace }}\artifacts\Switch

	- name: Publish UninstallChecker
	  run: dotnet publish UninstallChecker -c Release -o ${{ github.workspace }}\artifacts\UninstallChecker

	- name: Signing placeholder
	  run: |
		echo "Signing placeholder: insert code signing step here using secure secrets"

	- name: Install WiX Toolset
	  run: |
		choco install wix -y --no-progress
		refreshenv

	- name: Harvest application files with heat
	  run: |
		"${{ env.ProgramFiles }}\WiX Toolset v3.11\bin\heat.exe" dir "${{ github.workspace }}\\artifacts\\Switch" -cg AppFiles -dr INSTALLFOLDER -sreg -scom -gg -sfrag -out "${{ github.workspace }}\\Installer\\AppFiles.wxs"
	  env:
		ProgramFiles: ${{ runner.tool_cache }}

	- name: Compile WiX source
	  run: |
		"C:\ProgramData\chocolatey\lib\wix\tools\wix311\bin\candle.exe" -dPublishFolder="${{ github.workspace }}\\artifacts" -out "${{ github.workspace }}\\Installer\\obj\\Setup.wixobj" "${{ github.workspace }}\\Installer\\Setup.wxs" "${{ github.workspace }}\\Installer\\AppFiles.wxs"

	- name: Link MSI
	  run: |
		"C:\ProgramData\chocolatey\lib\wix\tools\wix311\bin\light.exe" -out "${{ github.workspace }}\\artifacts\\SwitchInstaller.msi" "${{ github.workspace }}\\Installer\\obj\\Setup.wixobj"

	- name: Upload MSI
	  uses: actions/upload-artifact@v4
	  with:
		name: SwitchInstaller
		path: artifacts/SwitchInstaller.msi
